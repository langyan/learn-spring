server:
  port: 8194

spring:
  application:
    name: movie-booking-simulator
  cloud:
    compatibility-verifier:
      enabled: false

movie-booking:
  booking:
    service-id: ${BOOKING_SERVICE_ID:movie-booking-booking-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8762/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
