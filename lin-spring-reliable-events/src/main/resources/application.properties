spring.application.name=lin-spring-reliable-events

# 默认 H2 内存库：零外部依赖即可运行与测试
spring.datasource.url=jdbc:h2:mem:eventsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator：健康检查、指标与 Prometheus 抓取
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# ---------- 事件基础设施配置 ----------
# 实例标识（多实例抢锁时用于区分 Pod A / Pod B；生产应注入 hostname/pod name）
app.events.instance-id=${INSTANCE_ID:local-1}

app.events.outbox.batch-size=20
app.events.outbox.poll-interval-ms=2000
app.events.outbox.max-attempts=5
app.events.outbox.base-delay-ms=1000
app.events.outbox.max-delay-ms=60000
app.events.outbox.jitter-ratio=0.2
app.events.outbox.lock-timeout-ms=60000
app.events.outbox.retention-days=7
app.events.outbox.cleanup-batch-size=200

app.events.inbox.batch-size=20
app.events.inbox.poll-interval-ms=2000
app.events.inbox.max-attempts=5
app.events.inbox.base-delay-ms=1000
app.events.inbox.max-delay-ms=60000
app.events.inbox.jitter-ratio=0.2
app.events.inbox.lock-timeout-ms=60000
app.events.inbox.retention-days=7
app.events.inbox.cleanup-batch-size=200

# 调度器生命周期健康阈值：积压超过该值时健康状态降级
app.events.health.max-backlog=100

logging.level.com.lin.spring.events=INFO
