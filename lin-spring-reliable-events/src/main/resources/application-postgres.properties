# postgres profile：生产形态演示（生产环境应使用 Flyway/Liquibase 受控迁移，而非 ddl-auto=update）
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5433/reliable_events}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:lin}
spring.datasource.password=${POSTGRES_PASSWORD:lin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
