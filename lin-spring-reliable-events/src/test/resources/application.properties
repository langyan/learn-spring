spring.application.name=lin-spring-reliable-events-test

# 随机库名：多个测试上下文（web/非 web）各自独立 H2 实例，
# 避免上下文逐出时 create-drop 删除共享库的表
spring.datasource.url=jdbc:h2:mem:events-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 测试：关闭调度器自动启动，由测试手动触发派发/重试
app.events.scheduler-auto-start=false
app.events.instance-id=test-instance

# 退避基数放大到 1s：断言 availableAt 晚于 now 时不受执行耗时抖动影响
app.events.outbox.base-delay-ms=1000
app.events.outbox.max-delay-ms=2000
app.events.outbox.lock-timeout-ms=1000
app.events.inbox.base-delay-ms=1000
app.events.inbox.max-delay-ms=2000
app.events.inbox.lock-timeout-ms=1000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
