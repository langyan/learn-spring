# 生产形态依赖：PostgreSQL + Redis + Kafka
# 启动：docker compose up -d
# 应用：mvnw spring-boot:run
services:
  postgres:
    image: postgres:16-alpine
    container_name: lin-spring-webhook-postgres
    environment:
      POSTGRES_DB: webhook
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "5434:5432"

  redis:
    image: redis:7.4-alpine
    container_name: lin-spring-webhook-redis
    ports:
      - "6381:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: lin-spring-webhook-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2184:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: lin-spring-webhook-kafka
    depends_on:
      - zookeeper
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
