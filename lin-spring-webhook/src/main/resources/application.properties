spring.application.name=lin-spring-webhook
server.port=8096

# ---------- PostgreSQL（事件、端点、投递流水的权威存储） ----------
spring.datasource.url=${WEBHOOK_DB_URL:jdbc:postgresql://localhost:5434/webhook}
spring.datasource.username=${WEBHOOK_DB_USER:webhook}
spring.datasource.password=${WEBHOOK_DB_PASSWORD:webhook}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Kafka（事件接入解耦） ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9094}
spring.kafka.consumer.group-id=webhook-workers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=3

# ---------- Redis（主队列 / 延迟队列 / 幂等键） ----------
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6381}

# ---------- Topic ----------
app.webhook.topics.events=webhook.events
app.webhook.topics.dlq=webhook.dlq

# ---------- 追问 1：指数退避重试 ----------
# 1 分钟 / 5 分钟 / 1 小时 / 3 小时 / 6 小时 / 12 小时 / 24 小时
app.webhook.retry.backoff-seconds=60,300,3600,10800,21600,43200,86400
app.webhook.retry.max-attempts=8
app.webhook.retry.max-duration-days=3
app.webhook.retry.jitter-ratio=0.2

# ---------- 投递：严格超时是防止慢商户拖垮池子的第一道防线 ----------
app.webhook.delivery.connect-timeout-ms=2000
app.webhook.delivery.response-timeout-ms=5000
app.webhook.delivery.max-connections=200
app.webhook.delivery.max-connections-per-route=20
app.webhook.delivery.worker-threads=8
app.webhook.delivery.batch-size=32
app.webhook.delivery.scheduler-delay-ms=1000
app.webhook.delivery.scheduler-batch-size=128

# ---------- 追问 2：租户隔离 ----------
app.webhook.isolation.per-merchant-max-concurrency=3
app.webhook.isolation.defer-seconds=5

# ---------- 追问 2：目的地断路器 ----------
app.webhook.circuit.failure-rate-threshold=50
app.webhook.circuit.sliding-window-size=20
app.webhook.circuit.minimum-number-of-calls=5
app.webhook.circuit.wait-duration-in-open-state-seconds=30
app.webhook.circuit.permitted-number-of-calls-in-half-open-state=2
app.webhook.circuit.max-offline-minutes=30

# ---------- 追问 3：SSRF ----------
# 演示需要把本机的 mock 接收端加进主机白名单；生产环境该列表应为空
app.webhook.ssrf.allowed-hosts=localhost
app.webhook.ssrf.allowed-ports=
app.webhook.ssrf.pin-ttl-seconds=300
app.webhook.ssrf.block-redirects=true

# ---------- 追问 4：幂等 ----------
app.webhook.idempotency.ttl-hours=72

# ---------- 可观测性 ----------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=${spring.application.name}

logging.level.com.lin.spring.webhook=INFO
logging.level.org.apache.kafka=WARN
