spring.application.name=lin-spring-notification
server.port=8095

# H2 内存库（演示用，生产可换 MySQL）
spring.datasource.url=jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 默认本地模式：进程内投递，无需 Kafka/Redis
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# 通知 Topic 配置
app.notification.topics.critical=notification.critical
app.notification.topics.transactional=notification.transactional
app.notification.topics.marketing=notification.marketing
app.notification.topics.retry=notification.retry
app.notification.topics.dlq=notification.dlq

# 重试与幂等
app.notification.retry.max-attempts=5
app.notification.retry.backoff-seconds=10,30,60,300
app.notification.idempotency.ttl-hours=24

# 定时通知轮询间隔（毫秒）
app.notification.scheduler.fixed-delay-ms=5000

# Provider 速率限制（TPS，演示背压）
app.notification.provider.push-tps=500
app.notification.provider.email-tps=200
app.notification.provider.sms-tps=100

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=${spring.application.name}

logging.level.com.lin.spring.notification=INFO
