# Kafka + Redis 模式：mvn spring-boot:run -Dspring-boot.run.profiles=kafka
spring.autoconfigure.exclude=

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9093}
spring.kafka.consumer.group-id=notification-workers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=3

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6380}

app.notification.kafka.send-timeout-seconds=5

logging.level.org.apache.kafka=WARN
