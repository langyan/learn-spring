spring:
  datasource:
    url: jdbc:h2:mem:jobscheduler;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  kafka:
    # dev profile：common 中的 DevKafkaBrokerConfig 会在本机 9092 启动嵌入式 Kafka（KRaft）；
    # 若其他服务进程已启动该端口，则本服务直接作为客户端接入。
    bootstrap-servers: localhost:9092

scheduler:
  cancel-ttl-seconds: 30
